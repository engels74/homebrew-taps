# Validation the old single-cask taps never had: every cask must parse, pass
# `brew style` and `brew audit`, and every pipeline script must pass shellcheck.
name: Lint

on:
  pull_request:
    paths:
      - "Casks/**"
      - "Formula/**"
      - "pipelines/**"
      - "scripts/**"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "Casks/**"
      - "Formula/**"
      - "pipelines/**"
      - "scripts/**"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  casks:
    name: brew style + audit
    runs-on: macos-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v7

      - name: Tap this checkout
        run: brew tap engels74/taps "$GITHUB_WORKSPACE"

      - name: Read all casks
        run: brew readall --no-simulate engels74/taps

      - name: brew style
        run: brew style engels74/taps

      - name: brew audit
        run: brew audit --cask --tap engels74/taps

  scripts:
    name: shellcheck + pipeline discovery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v7

      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -S warning -x scripts/*.sh scripts/lib/*.sh pipelines/*/resolve.sh

      - name: Every pipeline resolves to exactly one cask
        run: bash scripts/discover.sh
