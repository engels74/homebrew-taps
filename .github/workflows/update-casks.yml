# Scheduler: discover every pipelines/<cask>/ and run the shared pipeline
# (_update-cask.yml) for each one, sequentially.
#
# max-parallel: 1 keeps pushes from racing and stays under VirusTotal's free
# rate limit; fail-fast: false means one broken upstream never blocks the rest.
# Run a single cask by hand: gh workflow run update-casks.yml -f cask=qview
name: Update casks

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      cask:
        description: "Only update this cask token (leave blank for all)"
        required: false
        default: ""
        type: string

concurrency:
  group: tap-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout tap
        uses: actions/checkout@v7

      - name: Build matrix from pipelines/
        id: discover
        env:
          CASK_FILTER: ${{ inputs.cask }}
        run: |
          matrix="$(bash scripts/discover.sh "$CASK_FILTER")"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "Matrix: ${matrix}"

  update:
    needs: discover
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/_update-cask.yml
    with:
      cask: ${{ matrix.cask }}
    secrets: inherit
