name: Linux formulae

on:
  push:
    paths: ["Formula/**", "pipelines/**", "scripts/**", ".github/workflows/formulae.yml"]
  pull_request:
    paths: ["Formula/**", "pipelines/**", "scripts/**", ".github/workflows/formulae.yml"]
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formulae-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.sources.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve source updates
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then
            while IFS= read -r token; do
              bash scripts/resolve-formula.sh "$token" > "$RUNNER_TEMP/resolved.json"
              python3 scripts/write-formula.py "$RUNNER_TEMP/resolved.json"
            done < <(bash scripts/discover.sh '' formula | jq -r '.formula[]')
          fi
          if [[ "$EVENT" == schedule ]] && git diff --quiet -- Formula; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-formulae
          path: Formula/*.rb

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64_linux
          - runner: ubuntu-24.04-arm
            arch: arm64_linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_MAKE_JOBS: "2"
      BOTTLE_ROOT: https://github.com/${{ github.repository }}/releases/download/formulae-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - uses: Homebrew/actions/setup-homebrew@master
      - uses: actions/download-artifact@v8
        with:
          name: candidate-formulae
          path: Formula
      - name: Register checkout and virtual displays
        run: |
          set -euo pipefail
          tap_dir="$(brew --repository)/Library/Taps/engels74"
          mkdir -p "$tap_dir"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir/homebrew-taps"
          brew trust engels74/taps
          sudo apt-get update
          sudo apt-get install -y xvfb xauth weston dbus-x11
      - name: Build, test, and bottle each package in order
        run: |
          set -euo pipefail
          mkdir -p bottles
          # Bottle immediately: Homebrew records prefix changes during each build.
          for token in pipewire-gstreamer qview fredtv fcast-sender; do
            brew install --formula --build-bottle "engels74/taps/$token"
            brew test "engels74/taps/$token"
            brew linkage --test "engels74/taps/$token"
            brew audit --strict --formula "engels74/taps/$token"
            (cd bottles && brew bottle --json --no-rebuild --root-url="$BOTTLE_ROOT" "engels74/taps/$token")
          done
      - name: X11 and Wayland app checks
        run: bash scripts/test-linux-gui.sh
      - name: Reinstall from local bottles and retest
        run: |
          set -euo pipefail
          brew uninstall --formula fcast-sender fredtv qview pipewire-gstreamer
          for token in pipewire-gstreamer qview fredtv fcast-sender; do
            brew install --formula bottles/"$token"--*.bottle.tar.gz
            brew test "engels74/taps/$token"
          done
          bash scripts/test-linux-gui.sh
      - name: Archive corresponding sources and dependency licenses
        if: matrix.arch == 'x86_64_linux'
        run: |
          set -euo pipefail
          for token in pipewire-gstreamer qview fredtv fcast-sender; do
            python3 scripts/source-bundle.py "$token" bottles
          done
      - uses: actions/upload-artifact@v7
        with:
          name: bottles-${{ matrix.arch }}
          path: bottles/*
          retention-days: 14
      - name: Retain failure logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.arch }}
          path: |
            ~/.cache/Homebrew/Logs
            /tmp/tap-gui-results
      - name: Retain GUI evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.arch }}
          path: /tmp/tap-gui-results

  publish:
    needs: [prepare, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: tap-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: formulae-${{ github.run_id }}-${{ github.run_attempt }}
      BOTTLE_ROOT: https://github.com/${{ github.repository }}/releases/download/formulae-${{ github.run_id }}-${{ github.run_attempt }}
      BASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Homebrew/actions/setup-homebrew@master
      - uses: actions/download-artifact@v8
        with:
          name: candidate-formulae
          path: Formula
      - uses: actions/download-artifact@v8
        with:
          pattern: bottles-*
          merge-multiple: true
          path: bottles
      - name: Verify complete release and merge bottle metadata
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --exit-code "$BASE_SHA" origin/main -- Formula
          python3 scripts/verify-bottles.py bottles "$BOTTLE_ROOT"
          tap_dir="$(brew --repository)/Library/Taps/engels74"
          mkdir -p "$tap_dir"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir/homebrew-taps"
          brew trust engels74/taps
          brew bottle --merge --write --no-commit bottles/*.bottle.json
          brew style engels74/taps
      - name: Publish immutable binaries and corresponding sources
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Linux ARM64 and x86_64 bottles built from $BASE_SHA.

          Source archives include upstream sources, Rust/npm dependencies where used,
          licenses and the Homebrew build recipes. See SHA256SUMS and bottle JSON for provenance.

          X11 and headless Wayland launch tests passed. Hardware acceleration,
          real audio and FCast ScreenCast portal integration require desktop validation.
          EOF
          gh release create "$RELEASE_TAG" bottles/*.tar.gz bottles/*.bottle.json bottles/SHA256SUMS \
            --target "$BASE_SHA" --latest=false --title "Linux formulae $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
          mkdir -p "$RUNNER_TEMP/verify"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/verify"
          (cd "$RUNNER_TEMP/verify" && sha256sum -c SHA256SUMS)
      - name: Commit verified bottle definitions
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula
          git commit -m 'chore(formulae): update verified Linux bottles'
          git pull --rebase origin main
          git push origin HEAD:main
