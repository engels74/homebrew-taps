# GitHub disables scheduled workflows in repositories with no activity for 60
# days. This monthly job re-enables them using a personal token; the default
# github.token cannot do that.
name: immortality

on:
  schedule:
    # run once a month on the first day of the month at 02:00 UTC
    - cron: "0 2 1 * *"
  workflow_dispatch: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Keep workflows alive
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
          REPOS:        ${{ github.repository }}
        run: |
          bash ./scripts/vendor/gh-workflow-immortality.sh
